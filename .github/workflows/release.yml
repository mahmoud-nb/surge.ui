name: Release

# Publication de @surgeui/vue sur npm,
# puis création de la release GitHub
# au push d'un tag de version (créé par `npm run release` puis
# `git push --follow-tags origin main`).
on:
  push:
    tags:
      - 'v*.*.*'

# Une seule publication à la fois, jamais annulée en cours de route
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Le secret NPM_TOKEN est un secret de l'environnement « npm » : sans
    # cette ligne, le job ne le reçoit pas (npm publish : ENEEDAUTH)
    environment: npm
    permissions:
      contents: write   # création de la release GitHub
      id-token: write   # provenance npm (attestation de build)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Le tag doit correspondre à la version de la bibliothèque
      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package/vue/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version de package/vue/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # Version déjà publiée (publication manuelle) : on ne republie pas
      - name: Check npm registry
        id: registry
        run: |
          if npm view "@surgeui/vue@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@surgeui/vue@$VERSION est déjà publiée sur npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint (ESLint)
        run: npm run lint:js

      - name: Lint (Stylelint)
        run: npm run lint:style

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build:lib

      # require('@surgeui/vue') doit exposer les composants et le plugin
      # (entrée CommonJS dist/index.umd.cjs)
      - name: Check CommonJS entry
        run: |
          node -e "
            const lib = require('@surgeui/vue')
            if (!lib.Button || typeof lib.default?.install !== 'function') {
              console.error('Entrée CommonJS incomplète')
              process.exit(1)
            }
            // Manifeste d'API (dist/api.json) généré par le build
            const api = require('@surgeui/vue/api.json')
            if (Object.keys(api.components).length < 80 || api.version !== process.env.VERSION) {
              console.error('Manifeste api.json absent, incomplet ou d\'une autre version')
              process.exit(1)
            }
          "

      - name: Publish @surgeui/vue
        if: steps.registry.outputs.published == 'false'
        run: npm publish -w package/vue --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Notes de version : section du CHANGELOG correspondant au tag
      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Voir le [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > release-notes.md
          fi

      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::La release $GITHUB_REF_NAME existe déjà"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
