name: Release

# Publication de @surgeui/ds-vue sur npm et création de la release GitHub
# au push d'un tag de version (créé par `npm run release` puis
# `git push --follow-tags origin main`).
on:
  push:
    tags:
      - 'v*.*.*'

# Une seule publication à la fois, jamais annulée en cours de route
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # création de la release GitHub
      id-token: write   # provenance npm (attestation de build)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Le tag doit correspondre à la version de la bibliothèque
      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version de package/package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # Version déjà publiée (publication manuelle) : on ne republie pas
      - name: Check npm registry
        id: registry
        run: |
          if npm view "@surgeui/ds-vue@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@surgeui/ds-vue@$VERSION est déjà publiée sur npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: npm run lint:js

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish -w package --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Notes de version : section du CHANGELOG correspondant au tag
      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Voir le [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > release-notes.md
          fi

      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::La release $GITHUB_REF_NAME existe déjà"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
