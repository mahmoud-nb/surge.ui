name: Release

# Publication de @surgeui/vue et de son relais déprécié @surgeui/ds-vue sur npm,
# puis création de la release GitHub
# au push d'un tag de version (créé par `npm run release` puis
# `git push --follow-tags origin main`).
on:
  push:
    tags:
      - 'v*.*.*'

# Une seule publication à la fois, jamais annulée en cours de route
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Le secret NPM_TOKEN est un secret de l'environnement « npm » : sans
    # cette ligne, le job ne le reçoit pas (npm publish : ENEEDAUTH)
    environment: npm
    permissions:
      contents: write   # création de la release GitHub
      id-token: write   # provenance npm (attestation de build)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Le tag doit correspondre à la version de la bibliothèque, et le relais
      # à cette même version (sa version et sa dépendance @surgeui/vue)
      - name: Check tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package/vue/package.json').version")"
          RELAY_VERSION="$(node -p "require('./package/ds-vue/package.json').version")"
          RELAY_DEP="$(node -p "require('./package/ds-vue/package.json').dependencies['@surgeui/vue']")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version de package/vue/package.json ($PKG_VERSION)"
            exit 1
          fi
          if [ "$RELAY_VERSION" != "$PKG_VERSION" ] || [ "$RELAY_DEP" != "$PKG_VERSION" ]; then
            echo "::error::package/ds-vue/package.json (version $RELAY_VERSION, dépendance @surgeui/vue $RELAY_DEP) doit suivre la version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      # Version déjà publiée (publication manuelle) : on ne republie pas
      - name: Check npm registry
        id: registry
        run: |
          check() {
            if npm view "$1@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$1@$VERSION est déjà publiée sur npm"
              echo "$2=true" >> "$GITHUB_OUTPUT"
            else
              echo "$2=false" >> "$GITHUB_OUTPUT"
            fi
          }
          check @surgeui/vue vue
          check @surgeui/ds-vue relay

      - name: Lint
        run: npm run lint:js

      - name: Test
        run: npm test

      # Bibliothèque, puis relais (copie des feuilles de style)
      - name: Build library
        run: npm run build:lib

      - name: Publish @surgeui/vue
        if: steps.registry.outputs.vue == 'false'
        run: npm publish -w package/vue --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Relais déprécié, publié après la bibliothèque dont il dépend et une
      # seule fois : @surgeui/ds-vue@4.0.0 est la dernière version de l'ancien nom
      # (package/ds-vue est retiré du dépôt après cette release)
      - name: Publish @surgeui/ds-vue (relay)
        if: steps.registry.outputs.relay == 'false' && env.VERSION == '4.0.0'
        run: npm publish -w package/ds-vue --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Notes de version : section du CHANGELOG correspondant au tag
      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Voir le [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." > release-notes.md
          fi

      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::La release $GITHUB_REF_NAME existe déjà"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
